<!doctype html>
<html>
  <head>
    <title></title>
    <meta charset="utf-8" />
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style></style>
  </head>

  <body>
    <link href="stylesheet.css" rel="stylesheet" type="text/css" />

    <script type="module">
      import { createColorScale } from "./colorscale.js"; // Import the function
      const { colorRange, sortedCountryNames } = await createColorScale(); // Get sorted country names

      // Step 3: Define a color scale for countries using the sorted country names
      var countryColorScale = d3
        .scaleOrdinal()
        .domain(sortedCountryNames)
        .range(colorRange);

      // Set up the map dimensions
      const margin = { top: 0, right: 0, bottom: 0, left: 0 };
      const width = window.innerWidth - margin.left - margin.right;
      const height = window.innerHeight - margin.top - margin.bottom - 30;

      // Create an SVG element
      const svg = d3
        .select("body")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      svg
        .append("image")
        .attr("href", "../patterns/points_1-to-10_2000px_transparent.png")
        .attr("x", 0)
        .attr("y", 0)
        // .attr("width", 1500);
        .attr("height", innerHeight);

      var tooltipWidth = 180;
      var tooltip = d3
        .select("body")
        .append("div")
        .attr("class", "tooltip")
        .style("width", tooltipWidth + "px")
        .style("display", "none");

      var isMobile = window.innerWidth < 500; // Adjust the threshold as needed

      // Load GeoJSON file
      d3.json("countries_totals.geojson").then((geojson) => {
        tooltip.style("display", "none");
        // Filter GeoJSON data based on the selected year
        const plotData = geojson;

        // Calculate the bounding box of the GeoJSON features
        const [[x0, y0], [x1, y1]] = d3.geoBounds(plotData);

        // Calculate the width and height of the bounding box
        const boundingBoxWidth = x1 - x0;
        const boundingBoxHeight = y1 - y0;

        // Calculate the scale based on the bounding box dimensions and window size
        const scale =
          1.2 / Math.max(boundingBoxWidth / width, boundingBoxHeight / height);

        // Calculate the center of the bounding box
        const centerX = (x0 + x1) / 2;
        const centerY = (y0 + y1) / 2;

        // Create a projection with automatic fitting
        const projection = d3
          .geoMercator()
          .center([centerX, centerY])
          .scale(
            (scale * window.innerHeight) / (isMobile ? innerWidth / 33 : 16),
          ) // Adjust the initial scale as needed
          .translate(
            isMobile ? [width / 2.2, height / 2] : [width / 2, height / 2],
          );

        // Create a path generator
        let pathGenerator;

        // Assign a path generator for the second GeoJSON file
        pathGenerator = d3.geoPath().projection(projection);

        // Draw country outlines for the first GeoJSON file
        svg
          .selectAll(".country")
          .data(plotData.features)
          .enter()
          .append("path")
          .attr("class", "country")
          .attr("d", pathGenerator)
          .attr("fill", "#f7f7f7");

        var z = d3.scaleOrdinal().range(d3.schemePaired);

        const spaced = d3.formatLocale({
          decimal: ".",
          thousands: " ",
          grouping: [3],
        });

        const formatAbbreviation = spaced.format(",.0f");

        // const formatAbbreviation = d3.format(".2s");

        const eurScale = d3
          .scaleLinear()
          .domain([
            d3.min(geojson.features, (d) => +d.properties.eur),
            d3.max(geojson.features, (d) => +d.properties.eur),
          ])
          .range([0, 100]); // Adjust the range as needed

        function showTooltip(event, d) {
          const [x, y] = d3.mouse(svg.node());
          // Check if the mouse is in the right half of the screen
          const isMouseOnRightHalf = x > window.innerWidth / 2;

          const f = plotData.features[d].properties;

          let euLine;

          if (f.name === "Switzerland" || f.name === "Moldova") {
            euLine = "<br>Total grants: unknown";
          } else if (f.eu_contrib == null) {
            euLine = "<br>Total grants: " + formatAbbreviation(f.eur) + "€";
          } else {
            euLine =
              "<br>Total grants: " +
              formatAbbreviation(f.eur) +
              "€" +
              `<br>EU contribution: ${formatAbbreviation(f.eu_contrib)}€`;
          }

          tooltip
            .style(
              "left",
              (isMouseOnRightHalf ? x - tooltipWidth - 10 : x + 5) + "px",
            )
            .style("top", y + "px")
            .html("<b>" + f.name + "</b>" + " " + euLine);

          if (
            plotData.features[d].properties.eur > 0 ||
            f.name === "Switzerland" ||
            f.name === "Moldova"
          ) {
            tooltip.style("display", "inline-block");
          }
        }

        svg
          .selectAll("circle.base")
          .data(plotData.features)
          .join("circle")
          .attr("class", "base")
          .style("opacity", 0.6)
          .attr("cx", (d) => projection(d3.geoCentroid(d))[0])
          .attr("cy", (d) => projection(d3.geoCentroid(d))[1])
          .attr("r", (d) =>
            isMobile
              ? Math.sqrt(eurScale(+d.properties.eur)) * 2.2
              : Math.sqrt(eurScale(+d.properties.eur)) * 3,
          )
          .attr("fill", (d) => countryColorScale(d.properties.name))
          .on("mouseover", (event, d) => {
            showTooltip(event, d);
          })
          .on("click", (event, d) => {
            showTooltip(event, d);
          })
          .on("mousemove", (event, d) => {
            showTooltip(event, d);
          })
          .on("mouseout", function () {
            tooltip.style("display", "none");
          });

        svg
          .selectAll("circle.top")
          .data(plotData.features)
          .join("circle")
          .attr("class", "top")
          .style("opacity", 0.7)
          .attr("cx", (d) => projection(d3.geoCentroid(d))[0])
          .attr("cy", (d) => projection(d3.geoCentroid(d))[1])
          .attr("r", (d) =>
            isMobile
              ? Math.sqrt(eurScale(+d.properties.eu_contrib)) * 2.2
              : Math.sqrt(eurScale(+d.properties.eu_contrib)) * 3,
          )
          .attr("fill", "black")
          .on("mouseover", (event, d) => {
            showTooltip(event, d);
          })
          .on("click", (event, d) => {
            showTooltip(event, d);
          })
          .on("mousemove", (event, d) => {
            showTooltip(event, d);
          })
          .on("mouseout", function () {
            tooltip.style("display", "none");
          });

        svg
          .selectAll(".country")
          .on("mouseover", (event, d) => {
            showTooltip(event, d);
          })
          .on("mousemove", (event, d) => {
            showTooltip(event, d);
          })
          .on("click", (event, d) => {
            showTooltip(event, d);
          })
          .on("mouseout", function () {
            tooltip.style("display", "none");
          });
      });
    </script>
  </body>
</html>
