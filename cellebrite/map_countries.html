<!doctype html>
<html>
  <head>
    <title></title>
    <meta charset="utf-8" />
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style></style>
  </head>

  <body>
    <link href="stylesheet.css" rel="stylesheet" type="text/css" />

    <script type="module">
      import { createColorScale } from "./colorscale.js"; // Import the function
      const { colorRange, sortedCountryNames } = await createColorScale(); // Get sorted country names

      // Step 3: Define a color scale for countries using the sorted country names
      var countryColorScale = d3
        .scaleOrdinal()
        .domain(sortedCountryNames)
        .range(colorRange);

      // Set up the map dimensions
      const margin = { top: 10, right: 10, bottom: 10, left: 10 };
      const width = window.innerWidth - margin.left - margin.right;
      const height = window.innerHeight - margin.top - margin.bottom - 30;

      // Create an SVG element
      const svg = d3
        .select("body")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      svg
        .append("image")
        .attr("href", "points_1-to-10.png")
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", innerWidth)
        .attr("height", innerHeight);

      var tooltip = d3
        .select("body")
        .append("div")
        .attr("class", "tooltip")
        .style("width", "150px")
        .style("display", "none");

      var isMobile = window.innerWidth < 500; // Adjust the threshold as needed

      // Load GeoJSON file
      d3.json("countries_totals.geojson").then((geojson) => {
        tooltip.style("display", "none");
        // Filter GeoJSON data based on the selected year
        const plotData = geojson;

        // Calculate the bounding box of the GeoJSON features
        const [[x0, y0], [x1, y1]] = d3.geoBounds(plotData);

        // Calculate the width and height of the bounding box
        const boundingBoxWidth = x1 - x0;
        const boundingBoxHeight = y1 - y0;

        // Calculate the scale based on the bounding box dimensions and window size
        const scale =
          1.2 / Math.max(boundingBoxWidth / width, boundingBoxHeight / height);

        // Calculate the center of the bounding box
        const centerX = (x0 + x1) / 2;
        const centerY = (y0 + y1) / 2;

        // Create a projection with automatic fitting
        const projection = d3
          .geoMercator()
          .center([centerX, centerY])
          .scale((scale * window.innerHeight) / (isMobile ? 15 : 20)) // Adjust the initial scale as needed
          .translate(
            isMobile ? [width / 2.2, height / 2] : [width / 2, height / 2],
          );

        // Create a path generator
        let pathGenerator;

        // Assign a path generator for the second GeoJSON file
        pathGenerator = d3.geoPath().projection(projection);

        // Draw country outlines for the first GeoJSON file
        svg
          .selectAll(".country")
          .data(plotData.features)
          .enter()
          .append("path")
          .attr("class", "country")
          .attr("d", pathGenerator)
          .attr("stroke", "grey")
          .attr("fill", "white");

        var z = d3.scaleOrdinal().range(d3.schemePaired);

        // Define a format function with abbreviated numbers
        const formatAbbreviation = d3.format(".2s");

        const eurScale = d3
          .scaleLinear()
          .domain([
            d3.min(geojson.features, (d) => +d.properties.eur),
            d3.max(geojson.features, (d) => +d.properties.eur),
          ])
          .range([0, 100]); // Adjust the range as needed

        function showTooltip(event, d) {
          const [x, y] = d3.mouse(svg.node());
          // Check if the mouse is in the right half of the screen
          const isMouseOnRightHalf = x > window.innerWidth / 2;

          tooltip
            .style("left", (isMouseOnRightHalf ? x - 150 : x) + "px")
            .style("top", y + "px")
            .html(
              plotData.features[d].properties.name +
                " " +
                // selectedYear +
                "<br>Total grants: " +
                formatAbbreviation(plotData.features[d].properties.eur) +
                "<br>EU contribution: " +
                formatAbbreviation(plotData.features[d].properties.eu_contrib),
            );
        }

        svg
          .selectAll("circle.base")
          .data(plotData.features)
          .join("circle")
          .attr("class", "base")
          .style("opacity", 0.7)
          .attr("cx", (d) => projection(d3.geoCentroid(d))[0])
          .attr("cy", (d) => projection(d3.geoCentroid(d))[1])
          .attr("r", (d) =>
            isMobile
              ? Math.sqrt(eurScale(+d.properties.eur)) * 1.5
              : Math.sqrt(eurScale(+d.properties.eur)) * 2,
          )
          .attr("fill", (d) => countryColorScale(d.properties.name))
          .attr("stroke", "black")
          .on("mouseover", (event, d) => {
            if (plotData.features[d].properties.eur > 0) {
              tooltip.style("display", "inline-block");
            }

            showTooltip(event, d);
          })
          .on("click", (event, d) => {
            if (plotData.features[d].properties.eur > 0) {
              tooltip.style("display", "inline-block");
            }
            showTooltip(event, d);
          })
          .on("mousemove", (event, d) => {
            showTooltip(event, d);
          })
          .on("mouseout", function () {
            tooltip.style("display", "none");
          });

        svg
          .selectAll("circle.top")
          .data(plotData.features)
          .join("circle")
          .attr("class", "top")
          .style("opacity", 0.7)
          .attr("cx", (d) => projection(d3.geoCentroid(d))[0])
          .attr("cy", (d) => projection(d3.geoCentroid(d))[1])
          .attr("r", (d) =>
            isMobile
              ? Math.sqrt(eurScale(+d.properties.eu_contrib)) * 1.5
              : Math.sqrt(eurScale(+d.properties.eu_contrib)) * 2,
          )
          .attr("fill", "black")
          .on("mouseover", (event, d) => {
            if (plotData.features[d].properties.eur > 0) {
              tooltip.style("display", "inline-block");
            }
            showTooltip(event, d);
          })
          .on("click", (event, d) => {
            if (plotData.features[d].properties.eur > 0) {
              tooltip.style("display", "inline-block");
            }
            showTooltip(event, d);
          })
          .on("mousemove", (event, d) => {
            showTooltip(event, d);
          })
          .on("mouseout", function () {
            tooltip.style("display", "none");
          });

        svg
          .selectAll(".country")
          .on("mouseover", (event, d) => {
            if (plotData.features[d].properties.eur > 0) {
              tooltip.style("display", "inline-block");
            }
            showTooltip(event, d);
          })
          .on("mousemove", (event, d) => {
            showTooltip(event, d);
          })
          .on("click", (event, d) => {
            if (plotData.features[d].properties.eur > 0) {
              tooltip.style("display", "inline-block");
            }
            showTooltip(event, d);
          })
          .on("mouseout", function () {
            tooltip.style("display", "none");
          });
      });
    </script>
  </body>
</html>
